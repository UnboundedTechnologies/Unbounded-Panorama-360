<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070D"/>
      <stop offset="1" stop-color="#0D1424"/>
    </linearGradient>
    <linearGradient id="video" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#629A00"/>
      <stop offset="1" stop-color="#79AB51"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A92F2C"/>
      <stop offset="1" stop-color="#CB6236"/>
    </linearGradient>
    <clipPath id="s1"><rect x="143" y="52" width="140" height="290" rx="16"/></clipPath>
    <clipPath id="s2"><rect x="570" y="52" width="140" height="290" rx="16"/></clipPath>
    <clipPath id="s3"><rect x="997" y="52" width="140" height="290" rx="16"/></clipPath>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#bg)"/>

  <g font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <!-- 1. Anything, anywhere -->
    <rect x="131" y="40" width="164" height="314" rx="26" fill="#0A0E16" stroke="#5A6478" stroke-width="4"/>
    <g clip-path="url(#s1)">
      <rect x="143" y="52" width="140" height="290" fill="#05070D"/>
      <text x="213" y="104" font-size="34" font-weight="300" fill="#FFFFFF">09:15</text>
      <text x="213" y="126" font-size="11" fill="#BFC7D5">Thursday 15 October</text>
      <rect x="163" y="160" width="100" height="28" rx="14" fill="url(#red)"/>
      <text x="213" y="179" font-size="14" font-weight="700" fill="#FFFFFF">CPU 52°C</text>
      <rect x="163" y="200" width="100" height="28" rx="14" fill="url(#green)"/>
      <text x="213" y="219" font-size="14" font-weight="700" fill="#FFFFFF">GPU 44°C</text>
      <text x="246" y="268" font-size="13" fill="#FF7A59">4.9 GHz</text>
      <text x="180" y="300" font-size="13" fill="#22D3EE">RAM 38 %</text>
      <text x="213" y="330" font-size="16" font-weight="600" fill="#A78BFA">Hello!</text>
    </g>
    <text x="213" y="408" font-size="26" font-weight="700" fill="#EAF2FF">Anything, anywhere</text>
    <text x="213" y="442" font-size="16" fill="#8290AA">Clock, date, your text and live</text>
    <text x="213" y="466" font-size="16" fill="#8290AA">sensors, placed freely with smart</text>
    <text x="213" y="490" font-size="16" fill="#8290AA">guides, badges and any colour.</text>

    <!-- 2. Two media at once -->
    <rect x="558" y="40" width="164" height="314" rx="26" fill="#0A0E16" stroke="#5A6478" stroke-width="4"/>
    <g clip-path="url(#s2)">
      <rect x="570" y="52" width="140" height="138" fill="url(#video)"/>
      <rect x="570" y="190" width="140" height="152" fill="url(#photo)"/>
      <polygon points="628,102 628,142 660,122" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="640" cy="262" r="26" fill="#FFFFFF" opacity="0.35"/>
      <line x1="570" y1="190" x2="710" y2="190" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
    <text x="640" y="408" font-size="26" font-weight="700" fill="#EAF2FF">Two media at once</text>
    <text x="640" y="442" font-size="16" fill="#8290AA">A video on the top face, a photo on</text>
    <text x="640" y="466" font-size="16" fill="#8290AA">the curved front. Drag a file onto the</text>
    <text x="640" y="490" font-size="16" fill="#8290AA">screen and drop it where it belongs.</text>

    <!-- 3. Upright, the way it is mounted -->
    <rect x="985" y="40" width="164" height="314" rx="26" fill="#0A0E16" stroke="#00E5FF" stroke-width="4"/>
    <g clip-path="url(#s3)">
      <rect x="997" y="52" width="140" height="290" fill="#05070D"/>
      <polygon points="1067,120 1037,170 1057,170 1057,220 1077,220 1077,170 1097,170" fill="#00E5FF"/>
      <text x="1067" y="262" font-size="22" font-weight="700" fill="#00E5FF">UPRIGHT</text>
      <text x="1067" y="288" font-size="12" fill="#8290AA">portrait or landscape</text>
    </g>
    <text x="1067" y="408" font-size="26" font-weight="700" fill="#EAF2FF">Upright, as mounted</text>
    <text x="1067" y="442" font-size="16" fill="#8290AA">Portrait designs that read the</text>
    <text x="1067" y="466" font-size="16" fill="#8290AA">right way up on a vertical cooler,</text>
    <text x="1067" y="490" font-size="16" fill="#8290AA">or landscape: your choice.</text>
  </g>
</svg>
